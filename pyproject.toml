[tool.poetry]
name = "extractify-api"
version = "1.0.0"
description = "Extractify API"
authors = ["shannonssd <shannonssd@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.10"
django = "^4.2.0"
djangorestframework = "^3.14.0"
drf-yasg = "^1.21.4"
authlib = "^1.2.0"
django-debug-toolbar = "^4.1.0"
django-allow-cidr = "^0.6.0"
sentry-sdk = "^1.19.1"
gunicorn = "^21.2.0"
langchain = "^0.3.10"
langchain-core = "^0.3.22"
langchain-google-vertexai = "^2.0.8"
pillow = "^11.0.0"
google-cloud-aiplatform = "^1.74.0"
python-dotenv = "^1.0.1"
django-cors-headers = "^4.6.0"

[virtualenvs]
path = ".venv"

[tool.poetry.group.dev.dependencies]
mypy = "^1.1.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pytest = "^7.1.2"
pytest-django = "^4.5.2"
pre-commit = "^3.2.0"
django-stubs = {version = "^1.16.0", extras = ["compatible-mypy"]}
djangorestframework-stubs = {version = "^1.10.0", extras = ["compatible-mypy"]}
pytest-dotenv = "^0.5.2"
factory-boy = "^3.3.0"
types-factory-boy = "^0.4.1"
pytest-factoryboy = "^2.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "extractify_api.project.settings.dev"
